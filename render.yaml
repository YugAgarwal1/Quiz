services:
  - type: web
    name: quiz-bird
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_PATH
        value: ./data/quizbird.sqlite
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@quizbird.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin@123456
      - key: ADMIN_DEFAULT_NAME
        value: Quiz Administrator
